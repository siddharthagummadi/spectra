spring.application.name=spectra

server.port=${PORT:8080}

spring.main.banner-mode=off

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spectra_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# CORS Configuration (comma-separated origins or patterns)
spectra.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# AI Microservice URL & Resilience Configuration
spectra.ai-service.url=${AI_SERVICE_URL:${SPECTRA_AI_SERVICE_URL:http://${AI_SERVICE_HOSTPORT:localhost:8081}}}
spectra.ai-service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:2000}
spectra.ai-service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:5000}
spectra.ai-service.circuit-breaker.failure-threshold=${AI_SERVICE_CB_FAILURE_THRESHOLD:3}
spectra.ai-service.circuit-breaker.reset-timeout-ms=${AI_SERVICE_CB_RESET_TIMEOUT_MS:15000}

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Multivariate Anomaly Detection (Stage 2.3.1)
spectra.anomaly-detection.multivariate.enabled=${SPECTRA_ANOMALY_DETECTION_MULTIVARIATE_ENABLED:false}
