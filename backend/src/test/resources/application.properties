spring.application.name=spectra-test
spring.profiles.active=test

# Isolated in-memory H2 database for test execution (prevents connecting to development PostgreSQL)
spring.datasource.url=jdbc:h2:mem:spectra_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Clean schema generated from JPA entities per test run and dropped on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Multivariate Anomaly Detection (Default disabled in tests)
spectra.anomaly-detection.multivariate.enabled=false
