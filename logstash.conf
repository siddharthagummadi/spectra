# Logstash Pipeline Configuration for Spectra Distributed Log Ingestion
input {
  tcp {
    port => 5000
    codec => json_lines
  }
  beats {
    port => 5044
  }
}

filter {
  if [logger_name] {
    mutate {
      add_field => { "application" => "spectra" }
    }
  }
  
  # Categorize operational exceptions
  if [message] =~ /(?i)(OutOfMemoryError|HikariCP|Deadlock|TimeoutException|Connection refused)/ {
    mutate {
      add_tag => [ "operational_incident_candidate" ]
      add_field => { "incident_severity" => "CRITICAL" }
    }
  }

  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "spectra-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
